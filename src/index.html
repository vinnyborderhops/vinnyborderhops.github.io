<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A small collection of projects by vinnyborderhops."
    />
    <title>Projects</title>
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body class="min-h-screen bg-stone-950 text-stone-100 antialiased">
    <main
      class="mx-auto flex min-h-screen w-full max-w-5xl flex-col px-6 py-16 sm:px-10 sm:py-24"
    >
      <header class="mb-14 max-w-2xl">
        <h1 class="text-4xl font-bold tracking-tight text-white sm:text-6xl">
          Projects.
        </h1>
      </header>

      <section aria-labelledby="projects-heading">
        <h2 id="projects-heading" class="sr-only">Projects list</h2>

        <div id="projects" class="grid gap-5 sm:grid-cols-2"></div>
      </section>

      <script src="assets/projects.js"></script>

      <footer class="mt-auto pt-16 font-mono text-xs text-stone-500">
        <a
          class="transition-[color] duration-200 ease-out hover:text-accent focus:outline-none focus-visible:text-accent"
          href="https://github.com/vinnyborderhops"
          target="_blank"
          rel="noreferrer"
          >github.com/vinnyborderhops ↗</a

      </footer>

</html>
